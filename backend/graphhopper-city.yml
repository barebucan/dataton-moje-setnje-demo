graphhopper:
  datareader.file: /home/bartol_bucan/Roko/Dataton/docs/teme/A3_adrese/setnje/wordpress/data/raw/zagreb-city.osm.pbf
  graph.location: /home/bartol_bucan/Roko/Dataton/docs/teme/A3_adrese/setnje/wordpress/data/city-graph-cache
  graph.encoded_values: foot_access,foot_average_speed,foot_priority,foot_road_access,hike_rating,road_class,road_environment,roundabout,country,max_speed
  profiles:
    - name: foot
      custom_model:
        priority:
          - if: "!foot_access || foot_road_access == PRIVATE || hike_rating >= 2"
            multiply_by: "0"
          - else: ""
            multiply_by: "foot_priority"
        speed:
          - if: "true"
            limit_to: "foot_average_speed"
        distance_influence: 60
  profiles_ch: []
  profiles_lm: []
  routing.max_visited_nodes: 500000
  import.osm.ignored_highways: motorway,trunk
  prepare.min_network_size: 40
server:
  application_connectors:
    - type: http
      port: 8314
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8315
      bind_host: 127.0.0.1
  request_log:
    appenders: []
logging:
  level: INFO
  loggers:
    com.graphhopper.resources.SPTResource: WARN
  appenders:
    - type: console
